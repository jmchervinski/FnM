<header class="ficha-cabecalho">
  <img class="profile-img" src="{{actor.img}}" data-action="editImage" data-edit="img" title="{{actor.name}}" />

  <div class="ficha-cabecalho-conteudo">
    <div class="ficha-titulo">
      <input class="nome-personagem" name="name" type="text" value="{{actor.name}}" placeholder="Nome" />
      <span class="fnm-marca"><i class="fas fa-hand-fist"></i></span>
    </div>

    <div class="linha-dados">
      <label>Tipo
        <select name="system.detalhes.tipo">
          {{#each tiposNpc as |t|}}
          <option value="{{t}}" {{#if (eq t ../system.detalhes.tipo)}}selected{{/if}}>{{t}}</option>
          {{/each}}
        </select>
      </label>
      <label>Grau
        <select name="system.detalhes.grau">
          <option value="">—</option>
          {{#each graus as |g|}}
          <option value="{{g}}" {{#if (eq g ../system.detalhes.grau)}}selected{{/if}}>{{g}}</option>
          {{/each}}
        </select>
      </label>
      <label title="Nível de Desafio: ND 2 equivale a um personagem de nível 2 (Grimório, p. 8)">ND
        <input type="number" name="system.detalhes.nivel" value="{{system.detalhes.nivel}}" min="1" max="30" />
      </label>
      <label title="Define a dificuldade e todo o orçamento de criação (Grimório, p. 8)">Patamar
        <select name="system.detalhes.patamar">
          {{#each patamares as |p|}}
          <option value="{{p.id}}" {{#if (eq p.id ../system.detalhes.patamar)}}selected{{/if}}>{{p.nome}}</option>
          {{/each}}
        </select>
      </label>
      <label>Tamanho
        <select name="system.detalhes.tamanho">
          {{#each tamanhos as |t|}}
          <option value="{{t}}" {{#if (eq t ../system.detalhes.tamanho)}}selected{{/if}}>{{t}}</option>
          {{/each}}
        </select>
      </label>
      <label class="checkbox" title="Usa os totais digitados em vez das fórmulas do livro">
        <input type="checkbox" name="system.detalhes.valoresManuais" {{#if system.detalhes.valoresManuais}}checked{{/if}} />
        Valores manuais
      </label>
      <button type="button" class="importar-btn" data-action="importarInimigo"
              title="Preencher esta ficha a partir de um JSON de construtor de criaturas">
        <i class="fas fa-file-import"></i> Importar JSON
      </button>
    </div>

    <div class="linha-derivados">
      <span class="derivado">BT <b>{{sinal system.bonusTreinamento}}</b></span>
      <span class="derivado">DEF <b>{{system.combate.defesa}}</b></span>
      <span class="derivado">ATN <b>{{system.combate.atencao}}</b></span>
      <span class="derivado botao-inline" data-action="rolarIniciativa">INI <b>{{sinal system.combate.iniciativa}}</b> <i class="fas fa-dice-d20"></i></span>
      <span class="derivado">DESL <b>{{system.combate.deslocamentoAtual}}m</b></span>
      <span class="derivado">CD <b>{{system.cdAmaldicoada}}</b></span>
      <span class="derivado" title="Dificuldade do Patamar e jogadores recomendados (Grimório, p. 8)">
        {{system.orcamento.dificuldade}} · <b>{{system.orcamento.jogadores}}</b> jog.
      </span>
    </div>
  </div>
</header>
